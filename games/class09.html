    <body>
        <div id="loading-screen">
            <div class="loading-content">
                <div class="loading-header">
                    <div class="title-group">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d2/Class_of_%2709_logo.png" class="mini-favicon" alt="icon">
                        <div class="loading-title">Class of '09</div>
                    </div>
                    <div class="loading-mb" id="mb-text">0.0MB of 27.0MB</div>
                </div>
                <div class="loading-bar-container">
                    <div class="loading-bar" id="loading-bar"></div>
                </div>
                <div class="loading-text" id="loading-text">getting jsdlivr stuff</div>
            </div>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="ownership-footer">all copyright held by SBN3</div>
        </div>

        <script>
            const loadingBar = document.getElementById("loading-bar");
            const loadingText = document.getElementById("loading-text");
            const mbText = document.getElementById("mb-text");
            const loadingScreen = document.getElementById("loading-screen");
            const totalBytes = 28311552;
            let loadedBytes = 0;
            let finishedLoading = false;

            function formatMB(bytes) {
                if (!bytes || bytes <= 0) return "0.0MB";
                return (bytes / (1024 * 1024)).toFixed(1) + "MB";
            }

            function updateLoadingProgress(bytesLoaded) {
                const cappedBytes = Math.min(bytesLoaded, totalBytes);
                const percent = Math.min(100, Math.max(0, cappedBytes / totalBytes * 100));
                loadingBar.style.width = percent.toFixed(1) + "%";
                mbText.textContent = formatMB(cappedBytes) + " of " + formatMB(totalBytes);
                loadingText.textContent = "getting jsdlivr stuff";
            }

            function finishLoadingScreen() {
                if (finishedLoading) return;
                finishedLoading = true;
                loadingBar.style.width = "100%";
                mbText.textContent = formatMB(totalBytes) + " of " + formatMB(totalBytes);
                loadingText.textContent = "your game is ready";
                setTimeout(function() {
                    loadingScreen.classList.add("fade-out");
                    loadingScreen.addEventListener("transitionend", function() {
                        loadingScreen.classList.add("hidden");
                    }, { once: true });
                    setTimeout(function() {
                        loadingScreen.classList.add("hidden");
                    }, 400);
                }, 500);
            }

            async function fetchPartWithProgress(url) {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch " + url + ": " + response.status);

                if (!response.body || !response.body.getReader) {
                    const buffer = await response.arrayBuffer();
                    loadedBytes += buffer.byteLength;
                    updateLoadingProgress(loadedBytes);
                    return buffer;
                }

                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;

                while (true) {
                    const result = await reader.read();
                    if (result.done) break;
                    const value = result.value;
                    received += value.length;
                    loadedBytes += value.length;
                    chunks.push(value);
                    updateLoadingProgress(loadedBytes);
                }

                const fullBuffer = new Uint8Array(received);
                let offset = 0;

                for (const chunk of chunks) {
                    fullBuffer.set(chunk, offset);
                    offset += chunk.length;
                }

                return fullBuffer.buffer;
            }

            async function mergeFiles(fileParts) {
                loadedBytes = 0;
                updateLoadingProgress(0);
                const buffers = [];
                for (let i = 0; i < fileParts.length; i++) {
                    buffers.push(await fetchPartWithProgress(fileParts[i]));
                }
                return URL.createObjectURL(new Blob(buffers));
            }

            function getParts(file, start, end) {
                let parts = [];
                for (let i = start; i <= end; i++) {
                    parts.push(file + ".part" + i);
                }
                return parts;
            }
            mergeFiles(getParts("game.zip", 1, 2)).then(async url => {
                window.gameZipUrl = url;
                let renpypre = document.createElement("script");
                renpypre.src = "https://cdn.jsdelivr.net/gh/genizy/web-port@725a19f20c3f376529284c9f86299581719e8d19/class-of-09/renpy-pre.js"
                let renpy = document.createElement("script");
                renpy.src = "https://cdn.jsdelivr.net/gh/genizy/web-port@725a19f20c3f376529284c9f86299581719e8d19/class-of-09/renpy.js"
                document.body.appendChild(renpypre);
                document.body.appendChild(renpy);
                renpy.onload = function() {
                    setTimeout(finishLoadingScreen, 500);
                };
            });
        </script>
